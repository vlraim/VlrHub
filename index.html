<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VlrHub | Roblox Script Hub</title>
    <meta
      name="description"
      content="VlrHub is a modern Roblox Script & Executor Hub featuring verified scripts, executor directory, search, favorites, and admin controls."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loader-ring"></div>
      <p>Loading VlrHub...</p>
    </div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">V</div>
          <div>
            <div class="brand-name">VlrHub</div>
            <div class="brand-sub">Script Platform</div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-link active" data-route="#/home">
            <span>🏠</span>
            <span>Home</span>
          </button>
          <button class="nav-link" data-route="#/scripts">
            <span>🧩</span>
            <span>Scripts</span>
          </button>
          <button class="nav-link" data-route="#/categories">
            <span>📚</span>
            <span>Categories</span>
          </button>
          <button class="nav-link" data-route="#/executors">
            <span>⚙️</span>
            <span>Executors</span>
          </button>
          <button class="nav-link" data-route="#/favorites">
            <span>⭐</span>
            <span>Favorites</span>
          </button>
          <button class="nav-link" data-route="#/profile">
            <span>👤</span>
            <span>Profile</span>
          </button>
          <button class="nav-link" data-route="#/settings">
            <span>🔧</span>
            <span>Settings</span>
          </button>
          <button class="nav-link" data-route="#/dashboard">
            <span>🛠️</span>
            <span>Admin</span>
          </button>
        </nav>

        <div class="sidebar-panel">
          <div class="panel-title">Quick Stats</div>
          <div class="stat-list">
            <div>
              <strong id="stats-count">0</strong>
              <span>Scripts</span>
            </div>
            <div>
              <strong id="stats-categories">0</strong>
              <span>Categories</span>
            </div>
            <div>
              <strong id="stats-users">18K</strong>
              <span>Members</span>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input
              id="global-search"
              type="text"
              placeholder="Search scripts, games, tags..."
              aria-label="Search scripts"
            />
          </div>

          <div class="top-actions">
            <button class="pill-button accent" id="new-notice-btn">New Scripts</button>
            <div class="user-chip">
              <div class="avatar">V</div>
              <div>
                <strong>Vlr</strong>
                <small>Premium User</small>
              </div>
            </div>
          </div>
        </header>

        <div id="app"></div>
      </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
